---
- name: Install Telegraf on Debian/Ubuntu
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts['os_family'] == "Debian"

- name: Install Telegraf on RHEL and derivatives
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts['os_family'] == "RedHat"

- name: Fail on unsupported OS family
  ansible.builtin.fail:
    msg: "telegraf role supports Debian and RedHat families, not {{ ansible_facts['os_family'] }}"
  when: ansible_facts['os_family'] not in ["Debian", "RedHat"]

- name: Deploy telegraf.conf
  ansible.builtin.template:
    src: telegraf.conf.j2
    dest: "{{ telegraf_config_path }}"
    owner: root
    group: telegraf
    mode: "0640"    # contains the InfluxDB token
  notify: Restart telegraf

- name: Enable and start Telegraf
  ansible.builtin.systemd:
    name: telegraf
    enabled: true
    state: started
