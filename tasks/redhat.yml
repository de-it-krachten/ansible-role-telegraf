---
# InfluxData publishes RPMs for RHEL 8 and 9 (and compatible rebuilds).
- name: Add InfluxData yum repository
  ansible.builtin.yum_repository:
    name: influxdata
    description: InfluxData Repository - Stable
    baseurl: "{{ telegraf_influx_rpm_repo_url }}/rhel/{{ ansible_facts['distribution_major_version'] }}/$basearch/stable"
    gpgcheck: true
    gpgkey: "{{ telegraf_influx_repo_key_url }}"
    enabled: true

- name: Install Telegraf
  ansible.builtin.dnf:
    name: telegraf
    state: present
